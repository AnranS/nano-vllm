[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0; sys_platform == 'linux'",
    "transformers>=4.51.0",
    "flash-attn; sys_platform == 'linux'",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/GeeeekExplorer/nano-vllm"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]

# Keep the development runtime aligned with the prebuilt CUDA 13 extension.
[tool.uv]
constraint-dependencies = [
    "torch==2.12.1",
    "flash-attn==2.8.3.post1+cu.13.0.torch.2.12; sys_platform == 'linux'",
]

[tool.uv.sources]
flash-attn = { index = "astral-cu130" }

[[tool.uv.index]]
name = "astral-cu130"
url = "https://wheels.astral.sh/simple/cu130/"
explicit = true
