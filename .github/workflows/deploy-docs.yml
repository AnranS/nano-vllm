name: Deploy learning docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/web/**'
      - 'nanovllm/**'
      - 'example.py'
      - 'bench.py'
      - 'LICENSE'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and validate learning docs
        run: |
          python3 docs/web/build.py
          python3 docs/web/validate.py

      - name: Prepare static website
        run: |
          mkdir -p "$RUNNER_TEMP/nano-vllm-pages"
          cp docs/web/*.html docs/web/style.css docs/web/app.js "$RUNNER_TEMP/nano-vllm-pages/"
          cp -R docs/web/source "$RUNNER_TEMP/nano-vllm-pages/source"
          touch "$RUNNER_TEMP/nano-vllm-pages/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/nano-vllm-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
